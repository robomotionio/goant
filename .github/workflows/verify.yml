name: verify

# The six platforms goant ships on, running the three things that have actually
# found bugs in it:
#
#   - the unit suite, with the tier off and on. This is what found `SUB is not
#     SUBS`, which twelve hours of fuzzing on arm64 could not: every loop the
#     generator emits is bounded by a literal, so none of them ever needed the
#     back edge to exit.
#   - test262, twice per platform, gated on the DIFFERENCE between the two runs
#     rather than on either score. A tier bug is a test that fails only with the
#     tier on; a pass count cannot see that and a fixed threshold goes stale.
#   - the differential fuzzer, with the interpreter as the oracle, so a
#     disagreement is a tier bug by construction rather than a judgement call.
#
# Everything is CGO_ENABLED=0 except the race detector, which requires cgo.

# Only on main, and only when a human puts something there.
#
# There is no pull_request trigger. This repository is public, so a
# pull_request trigger runs a stranger's code on every fork's say-so, and the
# thing being protected is not worth the ceremony of protecting it: pre-merge
# checking is done by hand on a branch, and workflow_dispatch runs this whole
# file against any ref when a run is wanted before a merge. What lands here is
# what has already been merged, and this says whether main is still good.
#
# linux/arm64 is not here. It is covered on real Raspberry Pi hardware over
# ssh, which is a machine this repository does not have to be trusted by.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly, because the fuzzer finds more the longer it is left alone and a
    # nightly run is the only one whose corpus is not competing with a push.
    - cron: "0 3 * * *"

# Not cancel-in-progress. This reports on what is already on main, so a run is
# the record for one commit; cancelling it because a later commit arrived
# discards the answer for the earlier one and leaves a gap nobody notices. Two
# runs overlapping costs minutes, which are free on a public repository.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: "0"
  GO_VERSION: "1.26"
  # Pinned, so a test262 change cannot turn a green run red without a commit
  # here saying so.
  T262_SHA: b363f29d3c43c626dc852744ad64a0b48a003693

permissions:
  contents: read

jobs:
  unit:
    name: unit / ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04 amd64
            runs-on: ubuntu-22.04
          - name: ubuntu-24.04 amd64
            runs-on: ubuntu-24.04
          - name: windows amd64
            runs-on: windows-latest
          - name: macos arm64
            runs-on: macos-15
          - name: macos intel
            runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # linux/arm64 has no runner here, so the least this can do is prove it
      # still builds. What it actually does on that architecture is checked on
      # real hardware over ssh -- `SUB is not SUBS` compiled perfectly.
      - name: Cross-compile every shipping target
        if: matrix.runs-on == 'ubuntu-24.04'
        shell: bash
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} go build ./... || exit 1
            echo "  ok $t"
          done

      # unsafeptr is off for internal/jitmem and nowhere else. Turning the
      # address VirtualAlloc returned into a slice is what that package is for,
      # and vet cannot see through syscall.LazyProc.Call to know the memory came
      # from the OS rather than the Go heap — so it cannot move, and the
      # conversion is the legal one. The unix side never trips this because
      # syscall.Mmap hands back a []byte already.
      #
      # This failed the first Windows run there has ever been, on a line that
      # predates this workflow by months. `go test` does not run unsafeptr, so
      # nothing else would have said so.
      - name: Vet
        shell: bash
        run: |
          go vet $(go list ./... | grep -v '/internal/jitmem$')
          go vet -unsafeptr=false ./internal/jitmem/

      - name: Test, tier off
        run: go test ./...

      - name: Test, tier on
        env:
          GOANT_JIT: "1"
          GOANT_JIT_THRESHOLD: "2"
        run: go test -count=1 ./...

      # Threshold 1 compiles on the first entry, so no site has any type
      # feedback yet and every element access takes the generic path. It is a
      # different program from threshold 2 and has found bugs that 2 did not.
      - name: Test, tier on at threshold 1
        env:
          GOANT_JIT: "1"
          GOANT_JIT_THRESHOLD: "1"
        run: go test -count=1 ./...

      - name: Test under GC poisoning, tier on
        env:
          GOANT_GC_POISON: "1"
          GOANT_JIT: "1"
          GOANT_JIT_THRESHOLD: "2"
        run: go test -count=1 ./internal/engine/

      - name: Race detector, tier on
        env:
          CGO_ENABLED: "1"
          GOANT_JIT: "1"
          GOANT_JIT_THRESHOLD: "2"
        run: go test -count=1 -race ./internal/engine/

  test262:
    name: test262 / ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04 amd64
            runs-on: ubuntu-22.04
          - name: ubuntu-24.04 amd64
            runs-on: ubuntu-24.04
          - name: windows amd64
            runs-on: windows-latest
          - name: macos arm64
            runs-on: macos-15
          - name: macos intel
            runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          path: goant
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # The corpus is large and pinned, so it is worth caching by the SHA it is
      # pinned to: a cache miss costs one shallow fetch, a hit costs nothing,
      # and moving the pin invalidates it automatically.
      - name: Restore test262
        id: t262-cache
        uses: actions/cache@v4
        with:
          path: test262
          # Keyed by runner as well as by SHA. Actions caches are shared across
          # operating systems when the key matches, and the checkout below is
          # not byte-identical between them, so one OS could restore another's
          # copy and quietly undo the autocrlf setting.
          key: test262-${{ matrix.runs-on }}-${{ env.T262_SHA }}

      - name: Fetch test262
        if: steps.t262-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git init test262
          cd test262
          # autocrlf off. It defaults to true on the Windows runners, which
          # rewrites every line ending in the corpus on checkout -- and this
          # corpus tests line endings. line-terminator-normalisation-LF.js was
          # being handed CRLF and failing for it. The failure was invisible until
          # this job started running on Windows at all.
          git config core.autocrlf false
          git config core.eol lf
          git remote add origin https://github.com/tc39/test262.git
          git fetch --depth 1 origin "$T262_SHA"
          git checkout FETCH_HEAD

      - name: Build the runner
        shell: bash
        working-directory: goant
        # .exe on Windows, and the runner named explicitly rather than left to
        # the -runner default of "./goant". Without the suffix the harness's
        # exec of "./goant" fails LookPath on every single test, which is not a
        # hypothetical: it is what this job did for its whole existence.
        run: |
          EXE=""
          [ "$RUNNER_OS" = "Windows" ] && EXE=".exe"
          go build -o "goant$EXE" ./cmd/goant
          go build -o "goant-t262$EXE" ./cmd/goant-t262
          echo "T262=./goant-t262$EXE" >> "$GITHUB_ENV"
          echo "RUNNER=./goant$EXE" >> "$GITHUB_ENV"

      - name: test262, tier off
        shell: bash
        working-directory: goant
        # -all, not -core. -core is this repository's own exclusion list, and it
        # skips 6,224 files -- among them every one of the 4,603 Temporal tests
        # and the 3,357 in intl402. Both of those are implemented now and both
        # pass, so gating the tier on -core left a hole the size of Temporal: a
        # miscompilation anywhere in that code could not fail this job. The list
        # made sense when the features did not exist. It costs about 13% more
        # wall time to close.
        #
        # 30s rather than the 10s default. The generated property-escape tests
        # are enormous and the hosted runners are shared; at 10s they landed on
        # either side of the limit from run to run, which is noise this job then
        # had to reason about.
        run: $T262 -all -t262 ../test262 -runner "$RUNNER" -timeout 30s -failures ../off.txt | tee ../off.summary | tail -3

      - name: test262, tier on
        shell: bash
        working-directory: goant
        env:
          GOANT_JIT: "1"
          GOANT_JIT_THRESHOLD: "2"
        run: $T262 -all -t262 ../test262 -runner "$RUNNER" -timeout 30s -failures ../on.txt | tee ../on.summary | tail -3

      # The gate. Not the score: a score has to be kept up to date by hand and
      # goes stale the first time someone fixes a test. What must be zero is the
      # set of tests that fail ONLY with the tier on, because the tier is meant
      # to change how fast a program runs and not what it computes.
      #
      # Timeouts are held apart from that, in both directions. A test that runs
      # out of its ten seconds says something about how loaded the machine was,
      # not about what the compiler emitted -- and the macOS runners are the
      # slowest and most contended in the matrix, with several of the generated
      # property-escape tests sitting near the limit. Compared strictly, one of
      # them timed out with the tier on, two different ones timed out with it
      # off, and the job failed for machine load. A gate that cries wolf is a
      # gate people learn to ignore.
      #
      # They are reported rather than dropped. A compiled loop that cannot be
      # interrupted looks exactly like a timeout, and this engine has had one:
      # SUB is not SUBS made every compiled loop on arm64 uninterruptible. So a
      # timeout that appears only with the tier on is printed as a warning to be
      # looked at, and a wrong ANSWER is still the thing that fails the build.
      - name: No test may fail only with the tier on
        shell: bash
        run: |
          # A DIFFERENTIAL gate passes trivially when both arms are equally
          # broken, and it did: on Windows the harness could not exec the runner,
          # so all 47,351 tests failed identically with the tier off and on, the
          # two lists were byte-for-byte the same, and this step reported "0
          # tests answered differently" and went green. It was green for as long
          # as the job has existed, while testing nothing at all.
          #
          # So the difference is checked only after each arm is shown to have
          # RUN. Any exec failure is fatal, and so is a pass rate on the floor —
          # a proportion rather than a pinned score, so it never goes stale and
          # still catches a run that collapsed.
          for arm in off on; do
            if grep -q "executable file not found\|\[exec\]" "$arm.txt"; then
              echo "::error::the $arm arm could not run the engine — this is a broken harness, not a test result"
              grep -m 3 "executable file not found\|\[exec\]" "$arm.txt" | sed 's/^/  /'
              exit 1
            fi
            read -r pass total <<<"$(sed -n 's#^\([0-9][0-9]*\)/\([0-9][0-9]*\) passing.*#\1 \2#p' "$arm.summary" | head -1)"
            if [ -z "${pass:-}" ] || [ -z "${total:-}" ] || [ "$total" -eq 0 ]; then
              echo "::error::could not read a score out of the $arm arm; it did not finish"
              cat "$arm.summary"; exit 1
            fi
            if [ "$((pass * 100 / total))" -lt 50 ]; then
              echo "::error::the $arm arm passed $pass of $total — that is a broken run, not a regression"
              exit 1
            fi
            echo "$arm arm: $pass/$total"
          done

          answers() { awk -F'\t' '$2 !~ /timeout/ {print $1}' "$1" | sort -u; }
          timeouts() { awk -F'\t' '$2 ~ /timeout/ {print $1}' "$1" | sort -u; }

          new_timeouts=$(comm -13 <(timeouts off.txt) <(timeouts on.txt))
          if [ -n "$new_timeouts" ]; then
            echo "::warning::timed out only with the tier on — runner load, or a compiled loop that will not exit:"
            echo "$new_timeouts" | sed 's/^/  /'
          fi

          new_failures=$(comm -13 <(answers off.txt) <(answers on.txt))
          if [ -z "$new_failures" ]; then
            echo "0 tests answered differently with the tier on"
            exit 0
          fi
          echo "::error::tests failing only with the tier on:"
          echo "$new_failures" | sed 's/^/  /'
          exit 1

      - name: Keep the failure lists
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262-${{ matrix.runs-on }}
          path: |
            off.txt
            on.txt
          retention-days: 14

  fuzz:
    name: fuzz / ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04 amd64
            runs-on: ubuntu-22.04
          - name: ubuntu-24.04 amd64
            runs-on: ubuntu-24.04
          - name: windows amd64
            runs-on: windows-latest
          - name: macos arm64
            runs-on: macos-15
          - name: macos intel
            runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Carried between runs so coverage accumulates instead of starting cold
      # every time. Keyed by run id so each run writes its own entry and restores
      # the most recent one — the corpus only ever grows.
      - name: Restore the fuzz corpus
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-${{ matrix.runs-on }}-${{ github.run_id }}
          restore-keys: fuzz-${{ matrix.runs-on }}-

      - name: Differential fuzz, 5 minutes
        # bash, because windows-latest defaults to pwsh and this body is a shell
        # script: without it PowerShell parses `if git status ...` and stops at
        # "Missing '(' after 'if'", so the job goes red in under a second having
        # never run the fuzzer at all. Every other multi-line run: here says so.
        shell: bash
        # The VERDICT is whether a crasher was written, not the exit code.
        # `go test -fuzz` exits NON-ZERO with "context deadline exceeded" when
        # -fuzztime expires while a worker is mid-execution, so a clean run comes
        # back red -- it cost a false alarm on a four-hour arm64 run, and a red
        # build nobody can reproduce is worse than no build. A real disagreement
        # writes the failing input into testdata/fuzz/ and says so; nothing else
        # does, which is what the upload step below already assumes.
        run: |
          go test ./internal/engine/ -run xxx -fuzz FuzzJITAgreesWithTheInterpreter -fuzztime=5m -parallel=4 > fuzz.log 2>&1 || true
          tail -5 fuzz.log

          # The verdict below is "no crasher was written", and NOTHING is also no
          # crasher: a build error, a bad flag or a harness that dies on start-up
          # all produce a clean-looking run. The test262 job shipped exactly that
          # bug -- green for its whole existence while the runner could not exec
          # -- so prove the fuzzer actually fuzzed before believing its silence.
          if ! grep -q "elapsed:" fuzz.log; then
            echo "::error::the fuzzer never started; this is not a clean run"
            cat fuzz.log
            exit 1
          fi

          if git status --porcelain internal/engine/testdata/fuzz/ | grep -q . \
             || grep -qi "Failing input written\|failure while testing seed" fuzz.log; then
            echo "::error::the fuzzer found a disagreement"
            git status --porcelain internal/engine/testdata/fuzz/
            exit 1
          fi
          echo "fuzz clean: no crasher written"

      # A crasher is written under testdata/fuzz and is the whole value of the
      # run. Without this it dies with the runner.
      - name: Keep any failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crasher-${{ matrix.runs-on }}
          path: internal/engine/testdata/fuzz/**
          if-no-files-found: ignore
          retention-days: 30
