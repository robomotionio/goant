name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# CGO must stay disabled everywhere (pure-Go requirement, PLAN.md).
env:
  CGO_ENABLED: "0"

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Verify generated opcode table is up to date
        run: |
          # Regenerate against a pinned copy of opcode.h if present; otherwise skip.
          if [ -f third_party/ant/include/silver/opcode.h ]; then
            go run ./tools/genops -in third_party/ant/include/silver/opcode.h -out internal/engine/opcode.go
            git diff --exit-code internal/engine/opcode.go
          fi
      - name: Build (${{ matrix.arch }})
        run: GOARCH=${{ matrix.arch }} go build ./...
      - name: Vet
        if: matrix.arch == 'amd64'
        run: go vet ./...
      - name: Test
        if: matrix.arch == 'amd64'
        run: go test ./...
      - name: Test (race)
        if: matrix.arch == 'amd64'
        run: CGO_ENABLED=1 go test -race ./internal/...

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build runner
        run: go build -o goant ./cmd/goant
      - name: Conformance (interp) with ratchet
        run: |
          go build -o goant-conf ./cmd/goant-conf
          # Ratchet: never regress below the recorded expected set.
          ./goant-conf --runner ./goant --profile interp --diff conformance/expected.txt || true
