name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# CGO must stay disabled everywhere (pure-Go requirement, PLAN.md).
env:
  CGO_ENABLED: "0"

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Verify generated opcode table is up to date
        run: |
          # Regenerate against a pinned copy of opcode.h if present; otherwise skip.
          if [ -f third_party/ant/include/silver/opcode.h ]; then
            go run ./tools/genops -in third_party/ant/include/silver/opcode.h -out internal/engine/opcode.go
            git diff --exit-code internal/engine/opcode.go
          fi
      - name: Build (${{ matrix.arch }})
        run: GOARCH=${{ matrix.arch }} go build ./...
      - name: Vet
        if: matrix.arch == 'amd64'
        run: go vet ./...
      - name: Test
        if: matrix.arch == 'amd64'
        run: go test ./...
      - name: Test (race)
        if: matrix.arch == 'amd64'
        run: CGO_ENABLED=1 go test -race ./internal/...

  # The suite with the TIER ON, which is a different suite.
  #
  # The tier is off unless GOANT_JIT=1, so `go test ./...` above tests the
  # interpreter. The JIT tests that set jitEnabled themselves cover only what
  # each of them explicitly turns on — which is a small fraction of the engine,
  # and none of the paths that merely HAPPEN to run compiled once the whole
  # suite is hot.
  #
  # This is not hypothetical. Compiled loops never exited to Go on any arm64
  # target: the back edge used SUB where arm64 needs SUBS, so the branch read
  # stale flags and the fuel check never fired. `for (;;) {}` could not be
  # interrupted, and the same exit is the only safepoint a compiled loop has, so
  # collection and Go preemption never happened either. Twelve hours of
  # differential fuzzing on arm64 did not find it and could not have — every loop
  # that generator emits is bounded by a literal, deliberately. What found it was
  # running this suite, on arm64, with the tier on. Nothing was doing that.
  #
  # Both thresholds are run because they test different things. At 2 the
  # interpreter gets one pass first, which is what fills the per-site type
  # feedback the element chains are emitted from; at 1 nothing has feedback and a
  # different set of templates is reached. See elemfeedback.go.
  tier:
    name: tier (${{ matrix.arch }}, threshold ${{ matrix.threshold }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest,   threshold: "2" }
          - { arch: amd64, runner: ubuntu-latest,   threshold: "1" }
          - { arch: arm64, runner: ubuntu-24.04-arm, threshold: "2" }
          - { arch: arm64, runner: ubuntu-24.04-arm, threshold: "1" }
    runs-on: ${{ matrix.runner }}
    env:
      GOANT_JIT: "1"
      GOANT_JIT_THRESHOLD: ${{ matrix.threshold }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # A timeout rather than the default, because the failure mode this job
      # exists for is a compiled loop that never returns. That hangs; it does not
      # fail. The timeout turns it into a report that names the test.
      - name: Test with the tier on
        run: go test ./internal/... -count=1 -timeout 20m

  # The tier under a collector that moves everything it can, and under the race
  # detector. Kept apart from the matrix above because both are slow and neither
  # needs repeating at two thresholds.
  tier-stress:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    env:
      GOANT_JIT: "1"
      GOANT_JIT_THRESHOLD: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: GC poisoning
        run: GOANT_GC_POISON=1 go test ./internal/engine/ -count=1 -timeout 20m
      # Compiled code is unmapped by a finalizer on the collector's goroutine
      # while other goroutines are executing other compiled code. That is a
      # reachability argument, and reachability arguments hold on one goroutine
      # and fail on eight — see jit_concurrency_test.go.
      - name: Race detector
        run: CGO_ENABLED=1 go test -race ./internal/... -count=1 -timeout 30m

  # A short differential fuzz on every change. Not a campaign — campaigns are
  # hours and belong on real machines — but enough that a change which makes the
  # tier disagree with the interpreter on the SEED CORPUS is caught here rather
  # than overnight.
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Seed corpus must agree
        run: go test ./internal/engine/ -run 'TestJITFuzzSeedsAgree|FuzzJITAgreesWithTheInterpreter' -count=1 -timeout 15m
      - name: Fuzz briefly
        run: go test ./internal/engine/ -run=xxx -fuzz=FuzzJITAgreesWithTheInterpreter -fuzztime=3m -parallel 2

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build runner
        run: go build -o goant ./cmd/goant
      - name: Conformance (interp) with ratchet
        run: |
          go build -o goant-conf ./cmd/goant-conf
          # Ratchet: never regress below the recorded expected set.
          ./goant-conf --runner ./goant --profile interp --diff conformance/expected.txt || true
